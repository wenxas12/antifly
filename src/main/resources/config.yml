# TranAntiCheat - FLY-ONLY | PvP sunuculari icin
# Yapimci: wenxas | Uyumluluk: Paper 1.21.x
#
# NOT: Essentials /fly (gamemode fly) ve elytra kullanicilari Otomatik haric tutulur.
#      Yaratıcı/gezici mod, su, merdiven, levitasyon ve araç kullanicilari da istisnadır.

messages:
  prefix: "&8[&cTranAntiCheat&8] &r"
  no-permission: "&cBunu yapmak icin yetkin yok."
  unknown-player: "&cOyuncu cevrimici degil."
  reloaded: "&aConfig yeniden yuklendi."
  no-alerts: "&7Alert alimi kapali."
  joined-alerts: "&aAlert alimi acik."

punishments:
  # Kac ihlalden sonra alert
  alert-after: 1
  # Kac ihlalden sonra kick
  kick-after: 3
  # Kac ihlalden sonra ban
  ban-after: 4
  # Ban suresi (saniye) -1 = kalici
  ban-duration-seconds: -1
  kick-reason: "&cFly hilesi tespit edildi. Sunucudan atildin."
  ban-reason: "&cFly hilesi tespit edildi. Banlandin."

join-scan:
  enabled: true
  kick-message: "&cHileli istemci tespit edildi."
  # Girişte log gecmisi analizi (otomatik ban esigi)
  auto-ban-on-join-log: 20
  # Log-kayitlari hangi saat araliginda sayilir
  log-window-hours: 24
  # Bu istemci markalari (client brand) girişte engellenir
  blocked-clients:
    - thunder
    - meteor
    - doomsday
    - wurst
    - impact
    - liquidbounce
    - sigma
    - saint
    - kami
    - future
    - aristois
    - baritone
    - salhack
    - phobos
    - rusherhack
    - nightmare
    - skeleton
    - perch
    - atmosphere
    - tranz
  blocked-modules:
    - "AntiKillaura"
    - "Killaura"
    - "AutoTotem"
    - "Scaffold"
    - "NoFall"

checks:
  fly:
    # FLY tespiti acik/kapali
    enabled: true
    # Dikey yukselis ust siniri (blok/tick). Normal ziplama baslangici ~0.42'dir
    max-vertical-ascend: 0.45
    # Yukari-ziplama esigi (ust uste kac tick)
    vertical-ascend-ticks: 6
    # Hover (havada askida kalma) icin ust uste kac tick
    hover-ticks: 24
    # Hover sirasinda kabul edilen maks dikey delta (blok/tick)
    hover-max-dy: 0.03
    # Hover sirasinda kabul edilen maks yatay hareket
    hover-max-horizontal: 0.30
    # Ihlal azalma (decay) suresi (saniye)
    decay-seconds: 90.0
    # Havada ust uste kalinabilecek maks tick (1 sn = 20 tick). Asilirsa AirTime flag
    # NOT: normal dusus de sayilir, bu yuzden yuksek deger tut (ornek 6-10 sn)
    max-air-ticks: 120
    # Alert mesaj formati
    alert-message: "&e%player% &7| &6FLY &f%type% &7(x%vl%)"

  killaura:
    # KillAura tespiti (cok hizli hedef degistirme + hedefe bakmadan vurma + uzak vurus)
    enabled: true
    # Ayni iki hedef arasindaki saldiri gecikmesi BUNUN ALTINDAYSA MultiAura (ms)
    multi-aura-ms: 400
    # Hedefe bakma acisi bu degerin (derece) UZERINDE ise Angle (hedefe bakmadan vurma)
    max-angle: 85.0
    # Hedef merkezinden bu mesafeden UZAK saldiri Reach sayilir (blok)
    max-reach: 4.5
    # By-pass izni olanlar gormezden gelinir (trananticheat.bypass)
    alert-message: "&e%player% &7| &4KillAura &f%type% &7(x%vl%)"

  aim:
    # AimAssist / instant-turn tespiti. Tick basina asiri yaw degisimi + ust uste tekrar
    enabled: true
    # Tick basina izin verilen maks yaw degisimi (derece)
    max-yaw-per-tick: 60.0
    # Bu esik ust uste kac tick devam ederse flag (insan flicki 1-2 tick surer)
    required-ticks: 4
    alert-message: "&e%player% &7| &5Aim &f%type% &7(x%vl%)"

  triggerbot:
    # TriggerBot tespiti: cok kisa aralikli, surekli seri saldiri
    enabled: false
    # Art arda iki saldiri arasi BU ms'den kisa ise seri sayilir
    max-attack-delay-ms: 120
    # Kac seri saldiridan sonra flag
    required-hits: 3
    alert-message: "&e%player% &7| &cTriggerBot &f%type% &7(x%vl%)"

  xray:
    # NOT: X-Ray sunucu tarafinda %100 davranisal tespit edilemez.
    # Asil koruma join-scan blocked-clients listesidir (asagida).
    # Paper'daki anti-xray engine acik ise ore maskeleme ek koruma saglar.
    enabled: false
    alert-message: "&e%player% &7| &2XRay &f%type% &7(x%vl%)"